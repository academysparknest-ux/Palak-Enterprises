<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="aadhBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091428"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="aadhShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#aadhBg)"/>
  <g filter="url(#aadhShadow)" transform="translate(160, 120)">
    <rect width="480" height="320" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Top Tricolor Bar -->
    <rect x="0" y="0" width="480" height="10" rx="8" fill="#f97316"/>
    <rect x="0" y="6" width="480" height="4" fill="#ffffff"/>
    <rect x="0" y="10" width="480" height="4" fill="#16a34a"/>
    <!-- Aadhaar Header -->
    <text x="240" y="38" font-family="system-ui, sans-serif" font-weight="bold" font-size="13" fill="#dc2626" text-anchor="middle">भारत सरकार / GOVERNMENT OF INDIA</text>
    <line x1="20" y1="50" x2="460" y2="50" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Photo -->
    <rect x="30" y="68" width="95" height="120" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="77" cy="108" r="22" fill="#cbd5e1"/>
    <path d="M48 175 C48 145, 106 145, 106 175 Z" fill="#94a3b8"/>
    <!-- Details -->
    <text x="145" y="85" font-family="system-ui, sans-serif" font-weight="bold" font-size="15" fill="#0f172a">सुमन कुमारी / Suman Kumari</text>
    <text x="145" y="112" font-family="system-ui, sans-serif" font-size="12" fill="#475569">जन्म तिथि / DOB: 01/01/1998</text>
    <text x="145" y="134" font-family="system-ui, sans-serif" font-size="12" fill="#475569">महिला / Female</text>
    <text x="145" y="162" font-family="system-ui, sans-serif" font-weight="semibold" font-size="11" fill="#dc2626">मेरा आधार, मेरी पहचान</text>
    <!-- QR -->
    <rect x="375" y="70" width="75" height="75" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
    <text x="412" y="112" font-family="monospace" font-size="14" fill="#0f172a" text-anchor="middle">QR CODE</text>
    <!-- 12 Digit Number Banner -->
    <rect x="20" y="210" width="440" height="55" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="240" y="246" font-family="monospace" font-weight="900" font-size="24" fill="#dc2626" text-anchor="middle" letter-spacing="5">XXXX XXXX 1234</text>
    <!-- Bottom slogan -->
    <rect x="0" y="285" width="480" height="35" rx="8" fill="#dc2626"/>
    <text x="240" y="307" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">आधार - आम आदमी का अधिकार</text>
  </g>
  <rect x="30" y="30" width="200" height="32" rx="8" fill="#dc2626"/>
  <text x="130" y="51" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">AADHAAR PVC SAMPLE</text>
</svg>