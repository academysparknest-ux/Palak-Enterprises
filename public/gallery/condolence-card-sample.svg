<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="shokBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shokShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#shokBg)"/>
  <g filter="url(#shokShadow)" transform="translate(170, 90)">
    <rect width="460" height="380" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    <rect x="10" y="10" width="440" height="360" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <!-- Top Symbol -->
    <text x="230" y="50" font-family="serif" font-weight="bold" font-size="16" fill="#1e293b" text-anchor="middle">॥ ॐ शान्तिः शान्तिः शान्तिः ॥</text>
    <line x1="80" y1="65" x2="380" y2="65" stroke="#94a3b8" stroke-width="1"/>
    <text x="230" y="95" font-family="serif" font-weight="900" font-size="20" fill="#0f172a" text-anchor="middle">शोक-संदेश एवं श्रद्धांजलि</text>
    <text x="230" y="125" font-family="serif" font-size="12" fill="#475569" text-anchor="middle">अत्यंत दुःख के साथ सूचित करना पड़ रहा है कि हमारे पूज्य</text>
    <text x="230" y="155" font-family="serif" font-weight="bold" font-size="16" fill="#0f172a" text-anchor="middle">स्व० [नाम यहाँ प्रविष्ट करें]</text>
    <text x="230" y="180" font-family="serif" font-size="11" fill="#475569" text-anchor="middle">का स्वर्गवास दिनांक [तिथि] को हो गया है।</text>
    <!-- Program Details Box -->
    <rect x="40" y="200" width="380" height="90" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="230" y="225" font-family="serif" font-weight="bold" font-size="12" fill="#1e293b" text-anchor="middle">॥ कार्यक्रम विवरण ॥</text>
    <text x="55" y="250" font-family="serif" font-size="11" fill="#334155">• दशगात्र / एकादशाह: [तिथि एवं समय]</text>
    <text x="55" y="272" font-family="serif" font-size="11" fill="#334155">• ब्रह्मभोज / शांति पाठ: [तिथि एवं स्थान, चकिया]</text>
    <text x="230" y="320" font-family="serif" font-weight="bold" font-size="11" fill="#0f172a" text-anchor="middle">शोकाकुल: समस्त परिवार एवं स्वजन</text>
    <text x="230" y="345" font-family="serif" font-size="9" fill="#64748b" text-anchor="middle">पलक प्रिंटिंग प्रेस, चकिया (पूर्वी चम्पारण)</text>
  </g>
  <rect x="30" y="30" width="220" height="32" rx="8" fill="#475569"/>
  <text x="140" y="51" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">SHOK SANDESH CARD</text>
</svg>