<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bioBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="bioShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgBio)"/>

  <!-- Matrimonial Marriage Biodata Document Card (Main Subject) -->
  <g filter="url(#bioShadow)" transform="translate(180, 50) rotate(-1)">
    <rect width="440" height="500" rx="10" fill="#fffbeb" stroke="url(#bioBorderGrad)" stroke-width="4"/>
    
    <!-- Ornate Indian Maroon Border -->
    <rect x="15" y="15" width="410" height="470" fill="none" stroke="#78350f" stroke-width="2"/>
    <rect x="20" y="20" width="400" height="460" fill="none" stroke="#d97706" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- Ganesha Mantra Banner -->
    <text x="220" y="45" font-family="Georgia, serif" font-weight="bold" font-size="14" fill="#78350f" text-anchor="middle">॥ श्री गणेशाय नमः ॥</text>
    <text x="220" y="70" font-family="Georgia, serif" font-weight="900" font-size="22" fill="#991b1b" text-anchor="middle" letter-spacing="2">MARRIAGE BIODATA</text>
    <line x1="60" y1="80" x2="380" y2="80" stroke="#d97706" stroke-width="1.5"/>

    <!-- Passport Photo Frame Placeholder (Right Side) -->
    <rect x="300" y="95" width="100" height="125" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <rect x="306" y="101" width="88" height="113" fill="#ffffff" stroke="#d97706" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="350" cy="145" r="24" fill="#f59e0b"/>
    <path d="M315,195 Q350,170 385,195 Z" fill="#b45309"/>
    <text x="350" y="206" font-family="system-ui, sans-serif" font-weight="bold" font-size="9" fill="#78350f" text-anchor="middle">PHOTO HERE</text>

    <!-- Personal Details (Left Side) -->
    <text x="40" y="110" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#78350f">NAME:</text>
    <text x="120" y="110" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#0f172a">Rahul Kumar</text>

    <text x="40" y="130" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#78350f">D.O.B:</text>
    <text x="120" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#0f172a">12th May 1998 (7:15 AM)</text>

    <text x="40" y="150" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#78350f">HEIGHT:</text>
    <text x="120" y="150" font-family="system-ui, sans-serif" font-size="11" fill="#0f172a">5 Feet 9 Inches</text>

    <text x="40" y="170" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#78350f">CASTE:</text>
    <text x="120" y="170" font-family="system-ui, sans-serif" font-size="11" fill="#0f172a">Hindu / General</text>

    <text x="40" y="190" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#78350f">COMPLEXION:</text>
    <text x="120" y="190" font-family="system-ui, sans-serif" font-size="11" fill="#0f172a">Fair</text>

    <line x1="40" y1="230" x2="400" y2="230" stroke="#d97706" stroke-width="1"/>

    <!-- Educational & Professional Details -->
    <text x="40" y="250" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#991b1b">EDUCATIONAL &amp; WORK DETAILS</text>
    <text x="40" y="272" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#78350f">EDUCATION:</text>
    <text x="140" y="272" font-family="system-ui, sans-serif" font-size="11" fill="#0f172a">B.Tech (Computer Science)</text>

    <text x="40" y="292" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#78350f">OCCUPATION:</text>
    <text x="140" y="292" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#166534">Software Engineer at MNC</text>

    <text x="40" y="312" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#78350f">INCOME:</text>
    <text x="140" y="312" font-family="system-ui, sans-serif" font-size="11" fill="#0f172a">₹ 12 Lakhs Per Annum</text>

    <line x1="40" y1="330" x2="400" y2="330" stroke="#d97706" stroke-width="1"/>

    <!-- Family Background -->
    <text x="40" y="350" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#991b1b">FAMILY BACKGROUND</text>
    <text x="40" y="372" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#78350f">FATHER:</text>
    <text x="140" y="372" font-family="system-ui, sans-serif" font-size="11" fill="#0f172a">Shri Ramesh Sharma (Businessman)</text>

    <text x="40" y="392" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#78350f">MOTHER:</text>
    <text x="140" y="392" font-family="system-ui, sans-serif" font-size="11" fill="#0f172a">Smt. Sunita Sharma (Homemaker)</text>

    <text x="40" y="412" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#78350f">CONTACT:</text>
    <text x="140" y="412" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#1e3a8a">📞 +91 98765 43210</text>

    <text x="220" y="460" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" fill="#78350f" text-anchor="middle">Palak Printing Press • Matrimonial Biodata &amp; Photo Framing</text>
  </g>

  <!-- Product Badge -->
  <rect x="30" y="30" width="160" height="32" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="110" y="51" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#38bdf8" text-anchor="middle">SAMPLE DESIGN</text>
</svg>
