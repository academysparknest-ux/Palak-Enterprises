<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bankBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="bankShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bankBg)"/>
  <g filter="url(#bankShadow)" transform="translate(160, 110)">
    <rect width="480" height="340" rx="16" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
    <!-- Top Header -->
    <rect x="0" y="0" width="480" height="60" rx="14" fill="#4f46e5"/>
    <text x="240" y="28" font-family="system-ui, sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">घरेलू मनी ट्रांसफर व बिल भुगतान सेवा</text>
    <text x="240" y="48" font-family="system-ui, sans-serif" font-weight="semibold" font-size="11" fill="#c7d2fe" text-anchor="middle">AEPS • IMPS • NEFT • BBPS • RECHARGE</text>
    <!-- Center Transfer Animation Graphic -->
    <rect x="30" y="80" width="420" height="120" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
    <circle cx="90" cy="140" r="30" fill="#4f46e5"/>
    <text x="90" y="146" font-family="system-ui, sans-serif" font-weight="bold" font-size="18" fill="#ffffff" text-anchor="middle">₹</text>
    <text x="90" y="185" font-family="system-ui, sans-serif" font-size="9" fill="#4f46e5" text-anchor="middle">Sender Account</text>
    <!-- Arrow -->
    <path d="M140 140 L330 140 M315 125 L335 140 L315 155" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <text x="235" y="130" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#047857" text-anchor="middle">INSTANT TRANSFER</text>
    <circle cx="390" cy="140" r="30" fill="#10b981"/>
    <text x="390" y="146" font-family="system-ui, sans-serif" font-weight="bold" font-size="18" fill="#ffffff" text-anchor="middle">✓</text>
    <text x="390" y="185" font-family="system-ui, sans-serif" font-size="9" fill="#047857" text-anchor="middle">Beneficiary Bank</text>
    <!-- Transaction info -->
    <rect x="30" y="215" width="420" height="60" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="45" y="238" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#065f46">लेनदेन स्थिति: सफल (Transaction Successful)</text>
    <text x="45" y="258" font-family="system-ui, sans-serif" font-size="10" fill="#047857">UTR / RRN: 423610998520 • instant SMS confirmation</text>
    <!-- Footer -->
    <rect x="0" y="295" width="480" height="45" rx="14" fill="#312e81"/>
    <text x="240" y="322" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#e0e7ff" text-anchor="middle">बिजली बिल • मोबाइल/डीटीएच रिचार्ज • बैंक खाता सहायता</text>
  </g>
  <rect x="30" y="30" width="220" height="32" rx="8" fill="#4f46e5"/>
  <text x="140" y="51" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">MONEY TRANSFER &amp; BILLS</text>
</svg>