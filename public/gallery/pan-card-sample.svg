<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="panBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardPan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="panShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#panBg)"/>
  <g filter="url(#panShadow)" transform="translate(160, 130)">
    <rect width="480" height="300" rx="16" fill="url(#cardPan)" stroke="#0284c7" stroke-width="2"/>
    <!-- Card Header -->
    <rect x="0" y="0" width="480" height="55" rx="16" fill="#0369a1"/>
    <rect x="0" y="35" width="480" height="20" fill="#0369a1"/>
    <text x="240" y="26" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">आयकर विभाग / INCOME TAX DEPARTMENT</text>
    <text x="240" y="44" font-family="system-ui, sans-serif" font-weight="900" font-size="11" fill="#fef08a" text-anchor="middle">भारत सरकार / GOVT. OF INDIA</text>
    <!-- Photo Box -->
    <rect x="30" y="75" width="95" height="120" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="77" cy="115" r="22" fill="#cbd5e1"/>
    <path d="M48 180 C48 150, 106 150, 106 180 Z" fill="#94a3b8"/>
    <!-- Details -->
    <text x="145" y="90" font-family="system-ui, sans-serif" font-size="10" fill="#475569">नाम / Name</text>
    <text x="145" y="108" font-family="system-ui, sans-serif" font-weight="bold" font-size="14" fill="#0f172a">RAHUL KUMAR</text>
    <text x="145" y="132" font-family="system-ui, sans-serif" font-size="10" fill="#475569">पिता का नाम / Father's Name</text>
    <text x="145" y="150" font-family="system-ui, sans-serif" font-weight="bold" font-size="13" fill="#0f172a">RAMESH PRASAD</text>
    <text x="145" y="174" font-family="system-ui, sans-serif" font-size="10" fill="#475569">जन्म तिथि / Date of Birth</text>
    <text x="145" y="192" font-family="system-ui, sans-serif" font-weight="bold" font-size="13" fill="#0f172a">15/08/1995</text>
    <!-- PAN Number Banner -->
    <rect x="30" y="210" width="420" height="40" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="240" y="235" font-family="monospace" font-weight="900" font-size="18" fill="#0369a1" text-anchor="middle" letter-spacing="4">ABCDE1234F</text>
    <!-- Signature Box & QR Code -->
    <rect x="30" y="258" width="140" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="100" y="276" font-family="cursive, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">Rahul Kumar</text>
    <rect x="390" y="80" width="60" height="60" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
    <text x="420" y="115" font-family="monospace" font-size="16" fill="#0f172a" text-anchor="middle">QR</text>
  </g>
  <rect x="30" y="30" width="180" height="32" rx="8" fill="#0369a1"/>
  <text x="120" y="51" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">PAN CARD SAMPLE</text>
</svg>