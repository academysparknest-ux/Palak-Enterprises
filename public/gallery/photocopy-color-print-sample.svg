<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="xeroxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="xeroxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#xeroxBg)"/>
  <!-- Paper Stack -->
  <g filter="url(#xeroxShadow)" transform="translate(180, 110)">
    <!-- Bottom sheets -->
    <rect x="-15" y="15" width="420" height="320" rx="8" fill="#cbd5e1"/>
    <rect x="-8" y="8" width="420" height="320" rx="8" fill="#e2e8f0"/>
    <!-- Top Crisp White Document -->
    <rect width="420" height="320" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Document Header -->
    <rect x="25" y="25" width="370" height="35" rx="4" fill="#0284c7"/>
    <text x="210" y="47" font-family="system-ui, sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle">HIGH-SPEED PHOTOCOPY &amp; COLOR PRINTOUT</text>
    <!-- Document Body Content Preview -->
    <rect x="25" y="75" width="80" height="60" rx="4" fill="#e0f2fe"/>
    <circle cx="65" cy="100" r="14" fill="#0284c7"/>
    <text x="65" y="125" font-family="system-ui, sans-serif" font-size="7" fill="#0369a1" text-anchor="middle">Multicolor</text>
    <!-- Text skeleton lines -->
    <rect x="120" y="80" width="270" height="8" rx="2" fill="#0f172a"/>
    <rect x="120" y="96" width="250" height="6" rx="2" fill="#64748b"/>
    <rect x="120" y="110" width="260" height="6" rx="2" fill="#94a3b8"/>
    <rect x="120" y="124" width="220" height="6" rx="2" fill="#cbd5e1"/>
    <!-- Middle Table -->
    <rect x="25" y="150" width="370" height="90" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="25" y="150" width="370" height="22" fill="#f1f5f9"/>
    <text x="40" y="165" font-family="system-ui, sans-serif" font-weight="bold" font-size="9" fill="#334155">Doc Type</text>
    <text x="160" y="165" font-family="system-ui, sans-serif" font-weight="bold" font-size="9" fill="#334155">Resolution</text>
    <text x="280" y="165" font-family="system-ui, sans-serif" font-weight="bold" font-size="9" fill="#334155">Paper</text>
    <text x="40" y="190" font-family="system-ui, sans-serif" font-size="9" fill="#475569">B&amp;W Laser Xerox</text>
    <text x="160" y="190" font-family="system-ui, sans-serif" font-size="9" fill="#475569">1200 DPI Sharp</text>
    <text x="280" y="190" font-family="system-ui, sans-serif" font-size="9" fill="#475569">75 GSM JK Paper</text>
    <text x="40" y="215" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Color Document</text>
    <text x="160" y="215" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Vivid Color Print</text>
    <text x="280" y="215" font-family="system-ui, sans-serif" font-size="9" fill="#475569">100/130 GSM Gloss</text>
    <!-- Footer Badge -->
    <rect x="25" y="255" width="370" height="40" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
    <text x="210" y="278" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#0369a1" text-anchor="middle">सिंगल व डबल साइड फोटो कॉपी • तेज व स्पष्ट प्रिंट</text>
  </g>
  <rect x="30" y="30" width="220" height="32" rx="8" fill="#0284c7"/>
  <text x="140" y="51" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">PHOTOCOPY &amp; PRINT</text>
</svg>