<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="35%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="idShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgSlate)"/>

  <!-- Back Card (Layered Behind) -->
  <g filter="url(#idShadow)" transform="translate(420, 100) rotate(8)">
    <rect width="280" height="420" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <!-- Lanyard Hole Slot -->
    <rect x="110" y="15" width="60" height="12" rx="6" fill="#334155"/>
    <rect x="20" y="40" width="240" height="40" fill="#1e3a8a"/>
    <text x="140" y="65" font-family="system-ui, sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">TERMS &amp; INSTRUCTIONS</text>
    
    <!-- Fictional Sample Details -->
    <text x="30" y="110" font-family="system-ui, sans-serif" font-size="11" fill="#475569">1. This card is property of institution.</text>
    <text x="30" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#475569">2. If found, please return to office.</text>

    <!-- Barcode Box -->
    <rect x="30" y="260" width="220" height="60" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <g fill="#000000">
      <rect x="40" y="270" width="4" height="40"/>
      <rect x="47" y="270" width="2" height="40"/>
      <rect x="52" y="270" width="6" height="40"/>
      <rect x="61" y="270" width="3" height="40"/>
      <rect x="67" y="270" width="8" height="40"/>
      <rect x="78" y="270" width="2" height="40"/>
      <rect x="83" y="270" width="5" height="40"/>
      <rect x="91" y="270" width="4" height="40"/>
      <rect x="98" y="270" width="7" height="40"/>
      <rect x="108" y="270" width="3" height="40"/>
      <rect x="114" y="270" width="6" height="40"/>
      <rect x="123" y="270" width="4" height="40"/>
      <rect x="130" y="270" width="8" height="40"/>
      <rect x="141" y="270" width="2" height="40"/>
      <rect x="146" y="270" width="5" height="40"/>
      <rect x="154" y="270" width="4" height="40"/>
      <rect x="161" y="270" width="6" height="40"/>
      <rect x="170" y="270" width="3" height="40"/>
      <rect x="176" y="270" width="8" height="40"/>
      <rect x="187" y="270" width="2" height="40"/>
      <rect x="192" y="270" width="5" height="40"/>
      <rect x="200" y="270" width="4" height="40"/>
      <rect x="207" y="270" width="6" height="40"/>
      <rect x="216" y="270" width="3" height="40"/>
      <rect x="222" y="270" width="8" height="40"/>
      <rect x="233" y="270" width="2" height="40"/>
      <rect x="238" y="270" width="5" height="40"/>
    </g>
    <text x="140" y="340" font-family="monospace" font-size="10" fill="#334155" text-anchor="middle">*STU-2026-8941*</text>
    
    <text x="140" y="390" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#1e3a8a" text-anchor="middle">PVC CARD BACK SAMPLE</text>
  </g>

  <!-- Front PVC ID Card (Main Product) -->
  <g filter="url(#idShadow)" transform="translate(140, 80) rotate(-4)">
    <rect width="290" height="440" rx="18" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="2"/>
    
    <!-- Lanyard Punch Hole Slot -->
    <rect x="115" y="16" width="60" height="12" rx="6" fill="#0f172a"/>

    <!-- School Header -->
    <text x="145" y="52" font-family="system-ui, sans-serif" font-weight="900" font-size="15" fill="#ffffff" text-anchor="middle">GREENWOOD ACADEMY</text>
    <text x="145" y="68" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" fill="#93c5fd" text-anchor="middle">STUDENT IDENTITY CARD</text>

    <!-- Photo Frame Placeholder -->
    <rect x="85" y="90" width="120" height="145" rx="10" fill="#e2e8f0" stroke="#1e3a8a" stroke-width="3"/>
    <circle cx="145" cy="140" r="32" fill="#94a3b8"/>
    <path d="M100,210 Q145,175 190,210 Z" fill="#64748b"/>
    <text x="145" y="225" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" fill="#475569" text-anchor="middle">SAMPLE PHOTO</text>

    <!-- Fictional Student Information -->
    <text x="145" y="260" font-family="system-ui, sans-serif" font-weight="900" font-size="17" fill="#0f172a" text-anchor="middle">RAHUL KUMAR</text>
    <text x="145" y="278" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#2563eb" text-anchor="middle">CLASS: X - A | ROLL NO: 14</text>

    <line x1="30" y1="295" x2="260" y2="295" stroke="#cbd5e1" stroke-width="1"/>

    <text x="40" y="320" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#475569">FATHER:</text>
    <text x="110" y="320" font-family="system-ui, sans-serif" font-size="11" fill="#0f172a">Shri Suresh Kumar</text>

    <text x="40" y="340" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#475569">D.O.B:</text>
    <text x="110" y="340" font-family="system-ui, sans-serif" font-size="11" fill="#0f172a">15/08/2012</text>

    <text x="40" y="360" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#475569">BLOOD GRP:</text>
    <text x="110" y="360" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#dc2626">B +ve</text>

    <text x="40" y="380" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#475569">PHONE:</text>
    <text x="110" y="380" font-family="system-ui, sans-serif" font-size="11" fill="#0f172a">+91 98XXX XXXXX</text>

    <!-- Principal Signature Box -->
    <line x1="180" y1="410" x2="250" y2="410" stroke="#000000" stroke-width="1"/>
    <text x="215" y="422" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Principal Sign</text>
  </g>

  <!-- Product Badge -->
  <rect x="30" y="30" width="160" height="32" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="110" y="51" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#38bdf8" text-anchor="middle">SAMPLE DESIGN</text>
</svg>
