<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="rtpsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="rtpsShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#rtpsBg)"/>
  <g filter="url(#rtpsShadow)" transform="translate(170, 80)">
    <rect width="460" height="420" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
    <!-- Double border -->
    <rect x="10" y="10" width="440" height="400" fill="none" stroke="#d97706" stroke-width="1"/>
    <!-- Seal & Header -->
    <circle cx="230" cy="55" r="22" fill="#b45309"/>
    <text x="230" y="62" font-family="system-ui, sans-serif" font-weight="bold" font-size="16" fill="#ffffff" text-anchor="middle">★</text>
    <text x="230" y="95" font-family="system-ui, sans-serif" font-weight="bold" font-size="13" fill="#78350f" text-anchor="middle">बिहार सरकार / GOVERNMENT OF BIHAR</text>
    <text x="230" y="112" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#92400e" text-anchor="middle">लोक सेवाओं का अधिकार (RTPS BIHAR)</text>
    <rect x="80" y="125" width="300" height="24" rx="4" fill="#b45309"/>
    <text x="230" y="141" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">जाति / आय / निवास प्रमाण पत्र</text>
    <!-- Certificate Details -->
    <text x="35" y="180" font-family="system-ui, sans-serif" font-size="11" fill="#451a03">प्रमाण पत्र संख्या: <tspan font-weight="bold">BICC/2026/1089542</tspan></text>
    <text x="35" y="202" font-family="system-ui, sans-serif" font-size="11" fill="#451a03">आवेदन संख्या: <tspan font-weight="bold">BIRTPS2026-99052</tspan></text>
    <text x="35" y="224" font-family="system-ui, sans-serif" font-size="11" fill="#451a03">प्रमाणित किया जाता है कि <tspan font-weight="bold">अमित कुमार</tspan> पिता <tspan font-weight="bold">सुरेश राय</tspan></text>
    <text x="35" y="246" font-family="system-ui, sans-serif" font-size="11" fill="#451a03">ग्राम: चकिया, प्रखंड: चकिया, जिला: पूर्वी चम्पारण के निवासी हैं।</text>
    <!-- Stamp & QR -->
    <rect x="35" y="280" width="80" height="80" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="75" y="325" font-family="monospace" font-size="12" fill="#0f172a" text-anchor="middle">QR VERIFY</text>
    <circle cx="370" cy="320" r="35" fill="none" stroke="#15803d" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="370" y="318" font-family="system-ui, sans-serif" font-weight="bold" font-size="9" fill="#15803d" text-anchor="middle">DIGITALLY SIGNED</text>
    <text x="370" y="330" font-family="system-ui, sans-serif" font-size="8" fill="#15803d" text-anchor="middle">Circle Officer Chakia</text>
    <!-- Footer -->
    <line x1="20" y1="380" x2="440" y2="380" stroke="#d97706" stroke-width="1"/>
    <text x="230" y="398" font-family="system-ui, sans-serif" font-size="9" fill="#78350f" text-anchor="middle">यह प्रमाण पत्र डिजिटल रूप से हस्ताक्षरित है और पूर्णतः मान्य है।</text>
  </g>
  <rect x="30" y="30" width="220" height="32" rx="8" fill="#b45309"/>
  <text x="140" y="51" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">RTPS BIHAR CERTIFICATE</text>
</svg>