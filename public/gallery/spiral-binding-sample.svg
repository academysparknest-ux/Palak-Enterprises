<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSpiral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="spiralShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgSpiral)"/>

  <!-- Finished Spiral Bound Booklet Project (Main Subject) -->
  <g filter="url(#spiralShadow)" transform="translate(180, 80) rotate(-3)">
    <!-- Clear Protective Plastic Sheet Overlay Front Cover -->
    <rect width="440" height="450" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
    
    <!-- Title Card on Cover -->
    <rect x="40" y="40" width="360" height="370" rx="4" fill="#ffffff"/>
    <rect x="45" y="45" width="350" height="360" fill="none" stroke="#1e3a8a" stroke-width="2"/>

    <text x="220" y="110" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#1e3a8a" text-anchor="middle">ACADEMIC PROJECT REPORT</text>
    <text x="220" y="135" font-family="system-ui, sans-serif" font-weight="bold" font-size="14" fill="#dc2626" text-anchor="middle">ANNUAL THESIS 2026</text>

    <line x1="80" y1="155" x2="360" y2="155" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Topic Title -->
    <text x="220" y="200" font-family="system-ui, sans-serif" font-weight="bold" font-size="16" fill="#0f172a" text-anchor="middle">Computer Science &amp; IT Applications</text>

    <!-- Student & Guide Details -->
    <text x="70" y="270" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#475569">SUBMITTED BY:</text>
    <text x="70" y="290" font-family="system-ui, sans-serif" font-size="12" fill="#0f172a">Rahul Kumar (Roll: 1049)</text>

    <text x="70" y="330" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#475569">SUPERVISED BY:</text>
    <text x="70" y="350" font-family="system-ui, sans-serif" font-size="12" fill="#0f172a">Dr. A. K. Sharma (HOD)</text>

    <text x="220" y="390" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#2563eb" text-anchor="middle">Palak Printing Press • Spiral &amp; Hardcover Binding</text>

    <!-- Clear Cover Gloss Reflection Overlay -->
    <polygon points="0,0 200,0 0,450" fill="#ffffff" opacity="0.18"/>

    <!-- Plastic Black Spiral Coil Spine Along Left Edge -->
    <g fill="#000000" stroke="#475569" stroke-width="1">
      <ellipse cx="6" cy="20" rx="14" ry="7"/>
      <ellipse cx="6" cy="40" rx="14" ry="7"/>
      <ellipse cx="6" cy="60" rx="14" ry="7"/>
      <ellipse cx="6" cy="80" rx="14" ry="7"/>
      <ellipse cx="6" cy="100" rx="14" ry="7"/>
      <ellipse cx="6" cy="120" rx="14" ry="7"/>
      <ellipse cx="6" cy="140" rx="14" ry="7"/>
      <ellipse cx="6" cy="160" rx="14" ry="7"/>
      <ellipse cx="6" cy="180" rx="14" ry="7"/>
      <ellipse cx="6" cy="200" rx="14" ry="7"/>
      <ellipse cx="6" cy="220" rx="14" ry="7"/>
      <ellipse cx="6" cy="240" rx="14" ry="7"/>
      <ellipse cx="6" cy="260" rx="14" ry="7"/>
      <ellipse cx="6" cy="280" rx="14" ry="7"/>
      <ellipse cx="6" cy="300" rx="14" ry="7"/>
      <ellipse cx="6" cy="320" rx="14" ry="7"/>
      <ellipse cx="6" cy="340" rx="14" ry="7"/>
      <ellipse cx="6" cy="360" rx="14" ry="7"/>
      <ellipse cx="6" cy="380" rx="14" ry="7"/>
      <ellipse cx="6" cy="400" rx="14" ry="7"/>
      <ellipse cx="6" cy="420" rx="14" ry="7"/>
      <ellipse cx="6" cy="440" rx="14" ry="7"/>
    </g>

    <!-- Punch Holes on Paper -->
    <g fill="#000000" opacity="0.8">
      <circle cx="20" cy="20" r="3"/>
      <circle cx="20" cy="40" r="3"/>
      <circle cx="20" cy="60" r="3"/>
      <circle cx="20" cy="80" r="3"/>
      <circle cx="20" cy="100" r="3"/>
      <circle cx="20" cy="120" r="3"/>
      <circle cx="20" cy="140" r="3"/>
      <circle cx="20" cy="160" r="3"/>
      <circle cx="20" cy="180" r="3"/>
      <circle cx="20" cy="200" r="3"/>
      <circle cx="20" cy="220" r="3"/>
      <circle cx="20" cy="240" r="3"/>
      <circle cx="20" cy="260" r="3"/>
      <circle cx="20" cy="280" r="3"/>
      <circle cx="20" cy="300" r="3"/>
      <circle cx="20" cy="320" r="3"/>
      <circle cx="20" cy="340" r="3"/>
      <circle cx="20" cy="360" r="3"/>
      <circle cx="20" cy="380" r="3"/>
      <circle cx="20" cy="400" r="3"/>
      <circle cx="20" cy="420" r="3"/>
      <circle cx="20" cy="440" r="3"/>
    </g>
  </g>

  <!-- Product Badge -->
  <rect x="30" y="30" width="160" height="32" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="110" y="51" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#38bdf8" text-anchor="middle">SAMPLE DESIGN</text>
</svg>
