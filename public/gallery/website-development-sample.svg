<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="webBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="webShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#webBg)"/>
  <!-- Laptop Mockup -->
  <g filter="url(#webShadow)" transform="translate(130, 90)">
    <!-- Screen Bezel -->
    <rect width="440" height="270" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <circle cx="220" cy="12" r="3" fill="#64748b"/>
    <!-- Screen Content -->
    <rect x="12" y="24" width="416" height="234" rx="4" fill="#ffffff"/>
    <!-- Web Header -->
    <rect x="12" y="24" width="416" height="30" fill="#0f172a"/>
    <text x="25" y="44" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#f59e0b">PALAK ENTERPRISES</text>
    <text x="360" y="43" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">Home | Services | Contact</text>
    <!-- Web Hero Banner -->
    <rect x="20" y="60" width="400" height="75" rx="6" fill="#1e3a8a"/>
    <text x="35" y="85" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#ffffff">Professional Website Design</text>
    <text x="35" y="102" font-family="system-ui, sans-serif" font-size="9" fill="#93c5fd">For Schools, Shops, Businesses &amp; Coaching in Bihar</text>
    <rect x="35" y="112" width="70" height="15" rx="3" fill="#f59e0b"/>
    <text x="70" y="123" font-family="system-ui, sans-serif" font-weight="bold" font-size="8" fill="#0f172a" text-anchor="middle">Get Online</text>
    <!-- Web Cards Grid -->
    <rect x="20" y="145" width="125" height="100" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="25" y="150" width="115" height="45" rx="3" fill="#dbeafe"/>
    <text x="82" y="210" font-family="system-ui, sans-serif" font-weight="bold" font-size="9" fill="#1e3a8a" text-anchor="middle">School Portal</text>
    <rect x="155" y="145" width="125" height="100" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="160" y="150" width="115" height="45" rx="3" fill="#dcfce7"/>
    <text x="217" y="210" font-family="system-ui, sans-serif" font-weight="bold" font-size="9" fill="#166534" text-anchor="middle">Shop &amp; E-Commerce</text>
    <rect x="290" y="145" width="125" height="100" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="295" y="150" width="115" height="45" rx="3" fill="#fef3c7"/>
    <text x="352" y="210" font-family="system-ui, sans-serif" font-weight="bold" font-size="9" fill="#92400e" text-anchor="middle">Google Business</text>
    <!-- Laptop Base -->
    <path d="M-40 270 L480 270 L450 290 L-10 290 Z" fill="#334155"/>
    <rect x="180" y="272" width="80" height="4" rx="2" fill="#64748b"/>
  </g>
  <!-- Mobile Phone Mockup beside laptop -->
  <g filter="url(#webShadow)" transform="translate(540, 180)">
    <rect width="130" height="230" rx="16" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <rect x="8" y="16" width="114" height="198" rx="8" fill="#ffffff"/>
    <rect x="8" y="16" width="114" height="25" fill="#0f172a"/>
    <text x="65" y="32" font-family="system-ui, sans-serif" font-weight="bold" font-size="8" fill="#f59e0b" text-anchor="middle">Mobile View</text>
    <rect x="14" y="48" width="102" height="40" rx="4" fill="#1e3a8a"/>
    <rect x="14" y="95" width="102" height="45" rx="4" fill="#f1f5f9"/>
    <rect x="14" y="146" width="102" height="45" rx="4" fill="#f1f5f9"/>
  </g>
  <rect x="30" y="30" width="220" height="32" rx="8" fill="#0284c7"/>
  <text x="140" y="51" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">WEBSITE &amp; DIGITAL SETUP</text>
</svg>