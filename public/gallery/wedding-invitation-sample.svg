<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMaroon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#180202"/>
    </linearGradient>
    <linearGradient id="goldRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadowW" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgMaroon)"/>
  
  <!-- Envelope Behind -->
  <g filter="url(#shadowW)" transform="translate(130, 90)">
    <rect width="540" height="380" rx="16" fill="#581c87" stroke="url(#goldText)" stroke-width="3"/>
    <path d="M0,0 L270,180 L540,0" stroke="url(#goldText)" stroke-width="2" fill="none" stroke-dasharray="6,4"/>
  </g>

  <!-- Main Printed Wedding Invitation Card -->
  <g filter="url(#shadowW)" transform="translate(180, 110)">
    <rect width="440" height="380" rx="14" fill="url(#goldRed)" stroke="url(#goldText)" stroke-width="4"/>
    
    <!-- Ornate Traditional Indian Gold Border -->
    <rect x="18" y="18" width="404" height="344" rx="10" fill="none" stroke="url(#goldText)" stroke-width="2"/>
    <rect x="24" y="24" width="392" height="332" rx="8" fill="none" stroke="url(#goldText)" stroke-opacity="0.4" stroke-width="1"/>

    <!-- Ganesha Emblem -->
    <circle cx="220" cy="70" r="28" fill="#450a0a" stroke="url(#goldText)" stroke-width="2"/>
    <text x="220" y="78" font-family="Georgia, serif" font-weight="bold" font-size="24" fill="url(#goldText)" text-anchor="middle">卐 🕉 卐</text>

    <!-- Header Text -->
    <text x="220" y="122" font-family="Georgia, serif" font-weight="bold" font-size="16" fill="url(#goldText)" text-anchor="middle" letter-spacing="2">॥ श्री गणेशाय नमः ॥</text>
    <text x="220" y="145" font-family="Georgia, serif" font-size="13" fill="#fef08a" text-anchor="middle" letter-spacing="1">INVITATION FOR WEDDING CEREMONY</text>

    <line x1="80" y1="160" x2="360" y2="160" stroke="url(#goldText)" stroke-width="1"/>

    <!-- Couple Names Mockup -->
    <text x="220" y="200" font-family="Georgia, serif" font-style="italic" font-weight="bold" font-size="28" fill="url(#goldText)" text-anchor="middle">Rahul  &amp;  Pooja</text>
    <text x="220" y="225" font-family="Georgia, serif" font-size="12" fill="#fcd34d" text-anchor="middle">Request the pleasure of your company at their marriage</text>

    <!-- Details Box -->
    <rect x="60" y="245" width="320" height="85" rx="8" fill="#450a0a" fill-opacity="0.6" stroke="url(#goldText)" stroke-width="1"/>
    <text x="220" y="270" font-family="system-ui, sans-serif" font-weight="bold" font-size="13" fill="#ffffff" text-anchor="middle">DATE: Sunday, 22nd November 2026</text>
    <text x="220" y="290" font-family="system-ui, sans-serif" font-size="12" fill="#fde68a" text-anchor="middle">VENUE: Grand Palace Marriage Hall, City</text>
    <text x="220" y="310" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="url(#goldText)" text-anchor="middle">Printed by Palak Printing Press</text>
  </g>

  <!-- Product Label Badge -->
  <rect x="30" y="30" width="160" height="32" rx="8" fill="#450a0a" stroke="url(#goldText)" stroke-width="1"/>
  <text x="110" y="51" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="url(#goldText)" text-anchor="middle">SAMPLE DESIGN</text>
</svg>
