<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFloral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="100%" stop-color="#fae8ff"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadowF" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#86198f" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgFloral)"/>

  <g filter="url(#shadowF)" transform="translate(190, 85)">
    <rect width="420" height="430" rx="16" fill="#ffffff" stroke="url(#goldRing)" stroke-width="2"/>
    <rect x="12" y="12" width="396" height="406" rx="10" fill="none" stroke="#f0abfc" stroke-width="1.5"/>

    <!-- Ring Emblem -->
    <circle cx="210" cy="70" r="26" fill="#fdf4ff" stroke="url(#goldRing)" stroke-width="2"/>
    <text x="210" y="78" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="#a21caf" text-anchor="middle">💍 ✨ 💍</text>

    <!-- Header -->
    <text x="210" y="125" font-family="Georgia, serif" font-weight="bold" font-size="16" fill="#701a75" text-anchor="middle" letter-spacing="2">ENGAGEMENT CEREMONY</text>
    <text x="210" y="148" font-family="Georgia, serif" font-size="11" fill="#a21caf" text-anchor="middle">Save the date for the beginning of forever</text>

    <line x1="50" y1="165" x2="370" y2="165" stroke="url(#goldRing)" stroke-width="1"/>

    <!-- Couple Names -->
    <text x="210" y="210" font-family="Georgia, serif" font-style="italic" font-weight="bold" font-size="28" fill="#86198f" text-anchor="middle">Aditya  &amp;  Rhea</text>
    <text x="210" y="235" font-family="Georgia, serif" font-size="12" fill="#475569" text-anchor="middle">Cordially invite you to celebrate their ring exchange</text>

    <!-- Details Box -->
    <rect x="45" y="260" width="330" height="95" rx="8" fill="#fdf4ff" stroke="#e879f9" stroke-width="1"/>
    <text x="210" y="290" font-family="system-ui, sans-serif" font-weight="bold" font-size="13" fill="#701a75" text-anchor="middle">DATE: Sunday, October 25, 2026</text>
    <text x="210" y="312" font-family="system-ui, sans-serif" font-size="12" fill="#475569" text-anchor="middle">VENUE: The Grand Blossom Lawn, Chakia</text>
    <text x="210" y="335" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#a21caf" text-anchor="middle">PALAK DESIGN STUDIO • SKU: PE-ENG-301</text>
  </g>
</svg>
