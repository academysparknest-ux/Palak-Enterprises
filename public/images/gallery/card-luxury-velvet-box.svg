<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgNavyBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="boxVelvet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="shadowBox" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgNavyBox)"/>

  <!-- Luxury Hardboard Box Base -->
  <g filter="url(#shadowBox)" transform="translate(150, 75)">
    <rect width="500" height="450" rx="20" fill="url(#boxVelvet)" stroke="url(#goldPlate)" stroke-width="4"/>
    
    <!-- Outer Golden Trim Lines -->
    <rect x="18" y="18" width="464" height="414" rx="14" fill="none" stroke="url(#goldPlate)" stroke-width="2"/>
    <rect x="26" y="26" width="448" height="398" rx="10" fill="none" stroke="url(#goldPlate)" stroke-opacity="0.3" stroke-width="1"/>

    <!-- Center Metallic Acrylic Crest -->
    <circle cx="250" cy="110" r="48" fill="#0f172a" stroke="url(#goldPlate)" stroke-width="3"/>
    <text x="250" y="118" font-family="Georgia, serif" font-weight="bold" font-size="28" fill="url(#goldPlate)" text-anchor="middle">A &amp; S</text>

    <!-- Luxury Typography -->
    <text x="250" y="195" font-family="Georgia, serif" font-weight="bold" font-size="16" fill="url(#goldPlate)" text-anchor="middle" letter-spacing="4">IMPERIAL VELVET BOX INVITATION</text>
    <text x="250" y="220" font-family="Georgia, serif" font-size="12" fill="#c7d2fe" text-anchor="middle">RIGID HARDBOARD • SATIN RIBBON PULL • GOLD FOIL INSERTS</text>

    <!-- 2 Inner Printed Gold Leaf Inserts -->
    <rect x="60" y="250" width="180" height="150" rx="8" fill="#ffffff" stroke="url(#goldPlate)" stroke-width="1.5"/>
    <text x="150" y="285" font-family="Georgia, serif" font-weight="bold" font-size="12" fill="#312e81" text-anchor="middle">SANGEET &amp; MEHNDI</text>
    <text x="150" y="310" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Nov 18, 2026 • 7 PM</text>
    <text x="150" y="340" font-family="system-ui, sans-serif" font-weight="bold" font-size="9" fill="#eab308" text-anchor="middle">Insert 1 (Gold Embossed)</text>

    <rect x="260" y="250" width="180" height="150" rx="8" fill="#ffffff" stroke="url(#goldPlate)" stroke-width="1.5"/>
    <text x="350" y="285" font-family="Georgia, serif" font-weight="bold" font-size="12" fill="#312e81" text-anchor="middle">WEDDING &amp; BARAAT</text>
    <text x="350" y="310" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Nov 19, 2026 • 6 PM</text>
    <text x="350" y="340" font-family="system-ui, sans-serif" font-weight="bold" font-size="9" fill="#eab308" text-anchor="middle">Insert 2 (Gold Embossed)</text>

    <text x="250" y="422" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="url(#goldPlate)" text-anchor="middle">PALAK LUXURY COLLECTION • SKU: PE-WED-003</text>
  </g>
</svg>
