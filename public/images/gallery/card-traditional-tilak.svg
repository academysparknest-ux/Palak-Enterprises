<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSaffron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="goldTilak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadowTilak" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgSaffron)"/>

  <!-- Tilak Card Main Board -->
  <g filter="url(#shadowTilak)" transform="translate(190, 85)">
    <rect width="420" height="430" rx="16" fill="#9a3412" stroke="url(#goldTilak)" stroke-width="3"/>
    
    <rect x="14" y="14" width="392" height="402" rx="10" fill="none" stroke="url(#goldTilak)" stroke-width="1.5"/>
    <rect x="20" y="20" width="380" height="390" rx="8" fill="none" stroke="url(#goldTilak)" stroke-opacity="0.3" stroke-width="1"/>

    <!-- Sacred Kalash & Tilak Emblem -->
    <circle cx="210" cy="70" r="28" fill="#431407" stroke="url(#goldTilak)" stroke-width="2"/>
    <text x="210" y="78" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="url(#goldTilak)" text-anchor="middle">🚩 卐 🚩</text>

    <!-- Header Sanskrit -->
    <text x="210" y="125" font-family="Georgia, serif" font-weight="bold" font-size="16" fill="url(#goldTilak)" text-anchor="middle" letter-spacing="1">॥ शुभ तिलक एवं बरीक्षा संस्कार ॥</text>
    <text x="210" y="148" font-family="Georgia, serif" font-size="11" fill="#fed7aa" text-anchor="middle">श्री गणेशाय नमः • सपरिवार सादर आमंत्रण</text>

    <line x1="50" y1="164" x2="370" y2="164" stroke="url(#goldTilak)" stroke-width="1"/>

    <!-- Groom & Event Info -->
    <text x="210" y="210" font-family="Georgia, serif" font-style="italic" font-weight="bold" font-size="28" fill="url(#goldTilak)" text-anchor="middle">आयु. सौरभ कुमार</text>
    <text x="210" y="235" font-family="Georgia, serif" font-size="12" fill="#ffedd5" text-anchor="middle">का शुभ तिलक समारोह आपके पावन सान्निध्य में संपन्न होगा</text>

    <!-- Details Box -->
    <rect x="45" y="260" width="330" height="95" rx="8" fill="#431407" fill-opacity="0.7" stroke="url(#goldTilak)" stroke-width="1"/>
    <text x="210" y="290" font-family="system-ui, sans-serif" font-weight="bold" font-size="13" fill="#ffffff" text-anchor="middle">दिनांक: 15 नवंबर 2026 (शुभ मुहूर्त)</text>
    <text x="210" y="312" font-family="system-ui, sans-serif" font-size="12" fill="#fed7aa" text-anchor="middle">स्थान: निज निवास / मैरिज हॉल, चकिया</text>
    <text x="210" y="335" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="url(#goldTilak)" text-anchor="middle">पालक प्रिंटिंग प्रेस • SKU: PE-TLK-101</text>
  </g>
</svg>
