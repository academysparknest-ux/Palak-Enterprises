<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="lamShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgLam)"/>

  <!-- Transparent Sealed Lamination Pouch (Outer Layer) -->
  <g filter="url(#lamShadow)" transform="translate(160, 60) rotate(-3)">
    <!-- Clear Sealed Lamination Margin (15px transparent border) -->
    <rect width="480" height="470" rx="14" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>
    
    <!-- Heavy Plastic Sealed Edge Trim -->
    <rect x="5" y="5" width="470" height="460" rx="10" fill="none" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5"/>

    <!-- Inner Paper Document Sealed Inside -->
    <g transform="translate(20, 20)">
      <rect width="440" height="430" rx="4" fill="#fffbebe6" stroke="#d97706" stroke-width="3"/>
      
      <!-- Certificate Border inside Lamination -->
      <rect x="15" y="15" width="410" height="400" fill="none" stroke="#b45309" stroke-width="2"/>
      <rect x="20" y="20" width="400" height="390" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,4"/>

      <!-- Header -->
      <text x="220" y="65" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="#78350f" text-anchor="middle">OFFICIAL MARKSHEET &amp; CERTIFICATE</text>
      <text x="220" y="85" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#d97706" text-anchor="middle">BOARD OF HIGH SCHOOL &amp; INTERMEDIATE EDUCATION</text>

      <line x1="60" y1="100" x2="380" y2="100" stroke="#b45309" stroke-width="1"/>

      <!-- Document Data -->
      <text x="50" y="130" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#1e293b">Roll No: 202684910</text>
      <text x="260" y="130" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#1e293b">Year: 2026</text>
      <text x="50" y="155" font-family="system-ui, sans-serif" font-size="12" fill="#1e293b">Candidate Name: RAHUL KUMAR</text>
      <text x="50" y="175" font-family="system-ui, sans-serif" font-size="12" fill="#1e293b">Father's Name: SURESH KUMAR</text>

      <!-- Marks Table -->
      <rect x="50" y="195" width="340" height="150" fill="none" stroke="#78350f" stroke-width="1"/>
      <line x1="50" y1="220" x2="390" y2="220" stroke="#78350f" stroke-width="1"/>
      <text x="120" y="212" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#78350f">SUBJECT</text>
      <text x="320" y="212" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#78350f">MARKS</text>

      <text x="60" y="240" font-family="system-ui, sans-serif" font-size="11" fill="#1e293b">Mathematics</text>
      <text x="330" y="240" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#166534">95 / 100</text>

      <text x="60" y="265" font-family="system-ui, sans-serif" font-size="11" fill="#1e293b">Science</text>
      <text x="330" y="265" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#166534">92 / 100</text>

      <text x="60" y="290" font-family="system-ui, sans-serif" font-size="11" fill="#1e293b">English</text>
      <text x="330" y="290" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#166534">88 / 100</text>

      <!-- Bottom Stamp -->
      <circle cx="340" cy="375" r="22" fill="none" stroke="#dc2626" stroke-width="2"/>
      <text x="340" y="379" font-family="system-ui, sans-serif" font-weight="bold" font-size="8" fill="#dc2626" text-anchor="middle">PASSED</text>
    </g>

    <!-- Plastic Surface Gloss Reflections Across Document -->
    <polygon points="0,0 200,0 0,470" fill="#ffffff" opacity="0.25"/>
    <polygon points="300,0 480,0 180,470" fill="#ffffff" opacity="0.12"/>
    
    <text x="240" y="460" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#ffffff" text-anchor="middle">WATERPROOF HEAVY-DUTY LAMINATION SEAL</text>
  </g>

  <!-- Product Badge -->
  <rect x="30" y="30" width="160" height="32" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="110" y="51" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#38bdf8" text-anchor="middle">SAMPLE DESIGN</text>
</svg>
