<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgForm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="flowShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgForm)"/>

  <!-- Title Header -->
  <text x="400" y="55" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="1">ONLINE FORM APPLICATION WORKFLOW</text>
  <text x="400" y="78" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#38bdf8" text-anchor="middle">Government Scheme &amp; Job Form Filling Assistance Process</text>

  <!-- 3-Step Process Flowchart -->
  <!-- Step 1: Paper Document -->
  <g filter="url(#flowShadow)" transform="translate(60, 130)">
    <rect width="190" height="340" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="0" y="0" width="190" height="40" fill="#3b82f6" rx="12"/>
    <text x="95" y="25" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">1. Physical Documents</text>

    <!-- Content -->
    <rect x="20" y="60" width="150" height="30" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="30" y="79" font-family="system-ui, sans-serif" font-size="10" fill="#1e40af">📄 Aadhaar / ID Proof</text>

    <rect x="20" y="100" width="150" height="30" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="30" y="119" font-family="system-ui, sans-serif" font-size="10" fill="#1e40af">🎓 Educational Marksheet</text>

    <rect x="20" y="140" width="150" height="30" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="30" y="159" font-family="system-ui, sans-serif" font-size="10" fill="#1e40af">📸 Passport Photograph</text>

    <rect x="20" y="180" width="150" height="30" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="30" y="199" font-family="system-ui, sans-serif" font-size="10" fill="#1e40af">📝 Caste/Income Record</text>

    <rect x="15" y="240" width="160" height="75" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="95" y="270" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#475569" text-anchor="middle">Bring Original Docs</text>
    <text x="95" y="290" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Fast Physical Verification</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(265, 280)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#f59e0b" stroke-width="4"/>
    <polygon points="30,-8 45,0 30,8" fill="#f59e0b"/>
  </g>

  <!-- Step 2: Digital Online Form Portal -->
  <g filter="url(#flowShadow)" transform="translate(320, 130)">
    <rect width="190" height="340" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="0" y="0" width="190" height="40" fill="#f59e0b" rx="12"/>
    <text x="95" y="25" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#000000" text-anchor="middle">2. Online Application</text>

    <rect x="15" y="60" width="160" height="170" rx="6" fill="#1e293b"/>
    <text x="95" y="85" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#38bdf8" text-anchor="middle">PORTAL ENTRY</text>
    
    <rect x="25" y="100" width="140" height="18" rx="3" fill="#334155"/>
    <text x="35" y="113" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Name: Rahul Kumar</text>

    <rect x="25" y="125" width="140" height="18" rx="3" fill="#334155"/>
    <text x="35" y="138" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">DOB: 15/08/2000</text>

    <rect x="25" y="150" width="140" height="18" rx="3" fill="#334155"/>
    <text x="35" y="163" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Exam: SSC / Police</text>

    <rect x="35" y="180" width="120" height="25" rx="4" fill="#22c55e"/>
    <text x="95" y="196" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" fill="#ffffff" text-anchor="middle">SUBMIT FORM</text>

    <rect x="15" y="245" width="160" height="75" rx="6" fill="#fffbe6" stroke="#fde047" stroke-width="1"/>
    <text x="95" y="275" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#854d0e" text-anchor="middle">100% Accurate Data</text>
    <text x="95" y="295" font-family="system-ui, sans-serif" font-size="10" fill="#a16207" text-anchor="middle">Zero Error Guarantee</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(525, 280)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#f59e0b" stroke-width="4"/>
    <polygon points="30,-8 45,0 30,8" fill="#f59e0b"/>
  </g>

  <!-- Step 3: Submitted Printed Acknowledgment Slip -->
  <g filter="url(#flowShadow)" transform="translate(580, 130)">
    <rect width="170" height="340" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="0" y="0" width="170" height="40" fill="#16a34a" rx="12"/>
    <text x="85" y="25" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#ffffff" text-anchor="middle">3. Print Slip / PDF</text>

    <rect x="15" y="60" width="140" height="180" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="85" cy="90" r="16" fill="#16a34a"/>
    <text x="85" y="95" font-family="system-ui, sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">✓</text>
    <text x="85" y="120" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" fill="#166534" text-anchor="middle">SUCCESS</text>
    
    <text x="85" y="140" font-family="monospace" font-size="8" fill="#334155" text-anchor="middle">APP-NO: 20269814</text>
    <line x1="25" y1="150" x2="145" y2="150" stroke="#cbd5e1" stroke-width="1"/>
    
    <text x="85" y="170" font-family="system-ui, sans-serif" font-weight="bold" font-size="9" fill="#0f172a" text-anchor="middle">ACKNOWLEDGMENT</text>
    <text x="85" y="185" font-family="system-ui, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Printed Slip Issued</text>
    <text x="85" y="210" font-family="system-ui, sans-serif" font-weight="bold" font-size="8" fill="#2563eb" text-anchor="middle">Palak Printing Press</text>

    <rect x="15" y="250" width="140" height="70" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="85" y="280" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" fill="#166534" text-anchor="middle">Printed Slip Provided</text>
    <text x="85" y="298" font-family="system-ui, sans-serif" font-size="9" fill="#15803d" text-anchor="middle">+ Digital PDF Sent</text>
  </g>

  <!-- Product Badge -->
  <rect x="30" y="30" width="160" height="32" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="110" y="51" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#38bdf8" text-anchor="middle">SAMPLE DESIGN</text>
</svg>
