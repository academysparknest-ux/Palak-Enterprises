<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgStudio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="sheetShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgStudio)"/>

  <!-- 4x6 Glossy Printed Photo Paper Sheet (Main Subject) -->
  <g filter="url(#sheetShadow)" transform="translate(150, 70)">
    <rect width="500" height="460" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Paper Header Calibration & Cutting Guidelines -->
    <text x="250" y="32" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#475569" text-anchor="middle" letter-spacing="1">STUDIO GLOSSY PHOTO PRINT SHEET (4x6 INCH)</text>
    <line x1="30" y1="45" x2="470" y2="45" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- Grid of 8 Passport Photos (2 Rows x 4 Columns) -->
    <!-- Row 1 -->
    <!-- Photo 1 -->
    <g transform="translate(45, 65)">
      <rect width="90" height="115" stroke="#cbd5e1" stroke-width="1" fill="#2563eb"/>
      <circle cx="45" cy="45" r="24" fill="#f87171"/>
      <path d="M15,100 Q45,70 75,100 Z" fill="#1e3a8a"/>
      <rect x="0" y="0" width="90" height="115" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
    </g>
    <!-- Photo 2 -->
    <g transform="translate(150, 65)">
      <rect width="90" height="115" stroke="#cbd5e1" stroke-width="1" fill="#2563eb"/>
      <circle cx="45" cy="45" r="24" fill="#f87171"/>
      <path d="M15,100 Q45,70 75,100 Z" fill="#1e3a8a"/>
      <rect x="0" y="0" width="90" height="115" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
    </g>
    <!-- Photo 3 -->
    <g transform="translate(255, 65)">
      <rect width="90" height="115" stroke="#cbd5e1" stroke-width="1" fill="#2563eb"/>
      <circle cx="45" cy="45" r="24" fill="#f87171"/>
      <path d="M15,100 Q45,70 75,100 Z" fill="#1e3a8a"/>
      <rect x="0" y="0" width="90" height="115" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
    </g>
    <!-- Photo 4 -->
    <g transform="translate(360, 65)">
      <rect width="90" height="115" stroke="#cbd5e1" stroke-width="1" fill="#2563eb"/>
      <circle cx="45" cy="45" r="24" fill="#f87171"/>
      <path d="M15,100 Q45,70 75,100 Z" fill="#1e3a8a"/>
      <rect x="0" y="0" width="90" height="115" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
    </g>

    <!-- Row 2 -->
    <!-- Photo 5 -->
    <g transform="translate(45, 205)">
      <rect width="90" height="115" stroke="#cbd5e1" stroke-width="1" fill="#ffffff"/>
      <circle cx="45" cy="45" r="24" fill="#f87171"/>
      <path d="M15,100 Q45,70 75,100 Z" fill="#0f172a"/>
      <rect x="0" y="0" width="90" height="115" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
    </g>
    <!-- Photo 6 -->
    <g transform="translate(150, 205)">
      <rect width="90" height="115" stroke="#cbd5e1" stroke-width="1" fill="#ffffff"/>
      <circle cx="45" cy="45" r="24" fill="#f87171"/>
      <path d="M15,100 Q45,70 75,100 Z" fill="#0f172a"/>
      <rect x="0" y="0" width="90" height="115" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
    </g>
    <!-- Photo 7 -->
    <g transform="translate(255, 205)">
      <rect width="90" height="115" stroke="#cbd5e1" stroke-width="1" fill="#ffffff"/>
      <circle cx="45" cy="45" r="24" fill="#f87171"/>
      <path d="M15,100 Q45,70 75,100 Z" fill="#0f172a"/>
      <rect x="0" y="0" width="90" height="115" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
    </g>
    <!-- Photo 8 -->
    <g transform="translate(360, 205)">
      <rect width="90" height="115" stroke="#cbd5e1" stroke-width="1" fill="#ffffff"/>
      <circle cx="45" cy="45" r="24" fill="#f87171"/>
      <path d="M15,100 Q45,70 75,100 Z" fill="#0f172a"/>
      <rect x="0" y="0" width="90" height="115" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
    </g>

    <!-- Cutting Line Indicators -->
    <line x1="30" y1="340" x2="470" y2="340" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
    
    <!-- Color Calibration Palette Footer -->
    <text x="50" y="375" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#334155">35x45mm Official Passport Dimensions (Blue &amp; White BG Options)</text>
    
    <g transform="translate(50, 395)">
      <rect x="0" y="0" width="20" height="15" fill="#000000"/>
      <rect x="25" y="0" width="20" height="15" fill="#dc2626"/>
      <rect x="50" y="0" width="20" height="15" fill="#2563eb"/>
      <rect x="75" y="0" width="20" height="15" fill="#16a34a"/>
      <rect x="100" y="0" width="20" height="15" fill="#ca8a04"/>
      <rect x="125" y="0" width="20" height="15" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="160" y="12" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" fill="#64748b">Instant 5-Min Print Lab • Palak Printing Press</text>
    </g>
  </g>

  <!-- Product Badge -->
  <rect x="30" y="30" width="160" height="32" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="110" y="51" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#38bdf8" text-anchor="middle">SAMPLE DESIGN</text>
</svg>
