    <text x="15" y="245" font-family="system-ui, sans-serif" font-size="9" fill="#e2e8f0">• MS Office &amp; Excel</text>
    <text x="15" y="261" font-family="system-ui, sans-serif" font-size="9" fill="#e2e8f0">• Tally Prime ERP</text>
    <text x="15" y="277" font-family="system-ui, sans-serif" font-size="9" fill="#e2e8f0">• Data Entry &amp; DTP</text>

