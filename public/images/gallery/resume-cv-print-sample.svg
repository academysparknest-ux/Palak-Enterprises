    <line x1="15" y1="132" x2="115" y2="132" stroke="#475569" stroke-width="1"/>
    <text x="15" y="150" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">📞 +91 98765 43210</text>
    <text x="15" y="166" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">✉ amit@email.com</text>
    <text x="15" y="182" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">📍 Patna, Bihar</text>

