      <rect x="15" y="221" width="220" height="5" fill="#cbd5e1" rx="2"/>

      <text x="15" y="250" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" fill="#1e293b">Office Assistant | ABC Enterprises (2020 - 2022)</text>
      <rect x="15" y="260" width="240" height="5" fill="#cbd5e1" rx="2"/>
      <rect x="15" y="271" width="230" height="5" fill="#cbd5e1" rx="2"/>

      <text x="15" y="305" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#0f172a">EDUCATION</text>
