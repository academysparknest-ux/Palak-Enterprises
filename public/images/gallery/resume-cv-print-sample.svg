    <!-- Left Column Accent Header Bar -->
    <rect x="0" y="0" width="130" height="500" fill="#1e293b"/>

    <!-- Profile Circle Placeholder -->
    <circle cx="65" cy="65" r="32" fill="#3b82f6"/>
    <text x="65" y="73" font-family="system-ui, sans-serif" font-weight="bold" font-size="22" fill="#ffffff" text-anchor="middle">AK</text>

    <!-- Left Sidebar Content -->
