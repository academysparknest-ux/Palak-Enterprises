      <line x1="15" y1="112" x2="255" y2="112" stroke="#2563eb" stroke-width="1.5"/>
      <rect x="15" y="122" width="240" height="5" fill="#cbd5e1" rx="2"/>
      <rect x="15" y="133" width="230" height="5" fill="#cbd5e1" rx="2"/>
      <rect x="15" y="144" width="210" height="5" fill="#cbd5e1" rx="2"/>

