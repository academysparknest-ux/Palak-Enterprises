<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPDF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="pdfShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgPDF)"/>

  <!-- Scanned Document PDF Reader Window UI Mockup -->
  <g filter="url(#pdfShadow)" transform="translate(100, 70)">
    <!-- Window Frame -->
    <rect width="600" height="460" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>

    <!-- Window Titlebar -->
    <path d="M0,0 L600,0 L600,40 L0,40 Z" fill="#1e293b"/>
    <circle cx="20" cy="20" r="5" fill="#ef4444"/>
    <circle cx="36" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="20" r="5" fill="#10b981"/>

    <text x="300" y="25" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#cbd5e1" text-anchor="middle">Scanned_Document_300DPI.pdf — PDF Reader</text>

    <!-- Red PDF Tag -->
    <rect x="520" y="10" width="65" height="20" rx="4" fill="#dc2626"/>
    <text x="552" y="24" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" fill="#ffffff" text-anchor="middle">PDF HD</text>

    <!-- Sidebar Thumbnails -->
    <rect x="0" y="40" width="100" height="420" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    
    <!-- Thumbnail 1 -->
    <rect x="15" y="60" width="70" height="90" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect x="25" y="70" width="50" height="4" fill="#cbd5e1"/>
    <rect x="25" y="78" width="40" height="4" fill="#cbd5e1"/>
    <rect x="25" y="86" width="45" height="4" fill="#cbd5e1"/>
    <text x="50" y="140" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Page 1</text>

    <!-- Thumbnail 2 -->
    <rect x="15" y="165" width="70" height="90" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1"/>
    <rect x="25" y="175" width="50" height="4" fill="#cbd5e1"/>
    <rect x="25" y="183" width="42" height="4" fill="#cbd5e1"/>
    <text x="50" y="245" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Page 2</text>

    <!-- Main High Quality Scanned Document Display Area -->
    <g transform="translate(140, 60)">
      <rect width="420" height="380" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      
      <!-- Clear Optical Scan Header -->
      <rect x="30" y="30" width="360" height="50" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <circle cx="55" cy="55" r="14" fill="#2563eb"/>
      <text x="55" y="60" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">✓</text>
      <text x="80" y="50" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#1e40af">HIGH RESOLUTION DIGITAL SCAN</text>
      <text x="80" y="66" font-family="system-ui, sans-serif" font-size="10" fill="#3b82f6">300 DPI Optical Clarity • Clean PDF Conversion</text>

      <!-- Simulated Scanned Text & Stamp -->
      <text x="30" y="115" font-family="Georgia, serif" font-weight="bold" font-size="14" fill="#0f172a">CERTIFIED DOCUMENT PREVIEW</text>
      <rect x="30" y="125" width="360" height="4" fill="#64748b" rx="2"/>
      <rect x="30" y="135" width="340" height="4" fill="#64748b" rx="2"/>
      <rect x="30" y="145" width="310" height="4" fill="#64748b" rx="2"/>

      <rect x="30" y="165" width="360" height="4" fill="#64748b" rx="2"/>
      <rect x="30" y="175" width="330" height="4" fill="#64748b" rx="2"/>
      <rect x="30" y="185" width="350" height="4" fill="#64748b" rx="2"/>

      <!-- Scanned Seal Stamp -->
      <circle cx="310" cy="270" r="32" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,2"/>
      <text x="310" y="268" font-family="system-ui, sans-serif" font-weight="bold" font-size="9" fill="#dc2626" text-anchor="middle">SCANNED &amp; VERIFIED</text>
      <text x="310" y="278" font-family="system-ui, sans-serif" font-size="8" fill="#dc2626" text-anchor="middle">PALAK PRINTING PRESS</text>

      <text x="210" y="355" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#64748b" text-anchor="middle">Document Scanning &amp; PDF Conversion Service</text>
    </g>
  </g>

  <!-- Product Badge -->
  <rect x="30" y="30" width="160" height="32" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="110" y="51" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#38bdf8" text-anchor="middle">SAMPLE DESIGN</text>
</svg>
