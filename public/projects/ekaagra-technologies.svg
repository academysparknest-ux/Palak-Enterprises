<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="ekaagraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0e1320"/>
      <stop offset="100%" stop-color="#131a2b"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#ekaagraBg)"/>

  <!-- Top Nav Bar -->
  <rect width="1200" height="65" fill="#090d16" fill-opacity="0.9"/>
  <line x1="0" y1="65" x2="1200" y2="65" stroke="#1e293b" stroke-width="1"/>

  <g transform="translate(60, 22)">
    <text x="0" y="20" font-family="monospace" font-weight="900" font-size="18" fill="#ffffff" letter-spacing="1.5">EKAAGRA <tspan fill="#38bdf8" font-size="13">TECH</tspan></text>
  </g>

  <!-- Nav Capsule -->
  <g transform="translate(420, 16)">
    <rect width="400" height="34" rx="17" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <g transform="translate(30, 22)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">
      <text x="0" y="0">SERVICES</text>
      <text x="80" y="0">SOLUTIONS</text>
      <text x="170" y="0" fill="#ffffff">PROJECTS</text>
      <text x="255" y="0">PROCESS</text>
      <text x="325" y="0">PRICING</text>
    </g>
  </g>

  <!-- Top Right CTA -->
  <g transform="translate(1010, 16)">
    <rect width="130" height="34" rx="8" fill="#2563eb"/>
    <text x="65" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">START A PROJECT ↗</text>
  </g>

  <!-- Hero Content Left -->
  <g transform="translate(60, 120)">
    <rect x="0" y="0" width="260" height="26" rx="13" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb" stroke-opacity="0.3"/>
    <circle cx="12" cy="13" r="3.5" fill="#38bdf8"/>
    <text x="25" y="17" font-family="monospace" font-size="10" font-weight="800" fill="#38bdf8" letter-spacing="1">INDEPENDENT DIGITAL PRODUCT STUDIO</text>

    <text x="0" y="65" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="-1">
      We turn ideas into
    </text>
    <text x="0" y="120" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="44" fill="url(#blueGlow)" letter-spacing="-1">
      digital products.
    </text>

    <text x="0" y="165" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#94a3b8" font-weight="400">
      Ekaagra Technologies designs and develops websites, applications, custom software
    </text>
    <text x="0" y="188" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#94a3b8" font-weight="400">
      and scalable digital systems built around real business needs.
    </text>

    <g transform="translate(0, 220)">
      <rect width="160" height="44" rx="10" fill="#2563eb"/>
      <text x="80" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle">Start a Project ↗</text>

      <rect x="175" y="0" width="160" height="44" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="255" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle">Explore Our Work</text>
    </g>
  </g>

  <!-- Right Terminal / Architecture Console Box -->
  <g transform="translate(710, 110)">
    <rect width="430" height="280" rx="16" fill="#0e1320" stroke="#334155" stroke-width="1"/>
    <!-- Terminal Titlebar -->
    <rect width="430" height="36" rx="16" fill="#090d16"/>
    <rect y="26" width="430" height="10" fill="#090d16"/>
    <circle cx="18" cy="18" r="4.5" fill="#ef4444"/>
    <circle cx="34" cy="18" r="4.5" fill="#f59e0b"/>
    <circle cx="50" cy="18" r="4.5" fill="#10b981"/>
    <text x="70" y="22" font-family="monospace" font-size="10" fill="#94a3b8">ekaagra-studio // build-system</text>

    <g transform="translate(20, 55)">
      <rect width="390" height="85" rx="10" fill="#131a2b" stroke="#1e293b"/>
      <text x="15" y="25" font-family="monospace" font-size="9" fill="#38bdf8">ARCHITECTURE LAYER</text>
      <text x="15" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="14" fill="#ffffff">High-Performance Web Platform</text>
      <text x="15" y="65" font-family="monospace" font-size="11" fill="#94a3b8">Next.js 16 • React 19 • Tailwind CSS • Vercel</text>

      <g transform="translate(0, 100)">
        <rect width="122" height="48" rx="8" fill="#090d16" stroke="#1e293b"/>
        <text x="12" y="20" font-family="monospace" font-size="9" fill="#94a3b8">LIGHTHOUSE</text>
        <text x="12" y="38" font-family="monospace" font-size="14" font-weight="900" fill="#10b981">99/100</text>

        <rect x="134" y="0" width="122" height="48" rx="8" fill="#090d16" stroke="#1e293b"/>
        <text x="146" y="20" font-family="monospace" font-size="9" fill="#94a3b8">TTFB</text>
        <text x="146" y="38" font-family="monospace" font-size="14" font-weight="900" fill="#38bdf8">45ms</text>

        <rect x="268" y="0" width="122" height="48" rx="8" fill="#090d16" stroke="#1e293b"/>
        <text x="280" y="20" font-family="monospace" font-size="9" fill="#94a3b8">DEVICES</text>
        <text x="280" y="38" font-family="monospace" font-size="14" font-weight="900" fill="#a855f7">All Ready</text>
      </g>

      <g transform="translate(0, 160)">
        <rect width="390" height="50" rx="8" fill="#080b13" stroke="#1e293b"/>
        <text x="15" y="20" font-family="monospace" font-size="10" fill="#64748b">const app = createDigitalSolution({ stack: ["React", "Next.js"] });</text>
        <text x="15" y="36" font-family="monospace" font-size="10" fill="#10b981">✓ Compiled production build in 480ms</text>
      </g>
    </g>
  </g>

  <!-- 3 Service Rows Bottom -->
  <g transform="translate(60, 440)">
    <rect width="340" height="260" rx="14" fill="#0e1320" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="35" font-family="monospace" font-size="14" font-weight="900" fill="#38bdf8">01</text>
    <text x="50" y="35" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="16" fill="#ffffff">Website Development</text>
    <text x="20" y="75" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">
      Tailored responsive websites for schools, brands, institutions, and startups with sub-second performance.
    </text>
    <g transform="translate(20, 205)">
      <rect width="90" height="28" rx="6" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb"/>
      <text x="45" y="18" font-family="monospace" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">Next.js 16</text>
    </g>

    <g transform="translate(370, 0)">
      <rect width="340" height="260" rx="14" fill="#0e1320" stroke="#1e293b" stroke-width="1"/>
      <text x="20" y="35" font-family="monospace" font-size="14" font-weight="900" fill="#38bdf8">02</text>
      <text x="50" y="35" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="16" fill="#ffffff">Web App &amp; Software</text>
      <text x="20" y="75" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">
        Full-stack applications with databases, authentication, custom workflows, APIs, and administrative control.
      </text>
      <g transform="translate(20, 205)">
        <rect width="110" height="28" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981"/>
        <text x="55" y="18" font-family="monospace" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">PostgreSQL / Supabase</text>
      </g>
    </g>

    <g transform="translate(740, 0)">
      <rect width="340" height="260" rx="14" fill="#0e1320" stroke="#1e293b" stroke-width="1"/>
      <text x="20" y="35" font-family="monospace" font-size="14" font-weight="900" fill="#38bdf8">03</text>
      <text x="50" y="35" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="16" fill="#ffffff">School &amp; Enterprise ERP</text>
      <text x="20" y="75" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">
        Complete institutional software covering student records, fees, exams, staff management, and parent SMS.
      </text>
      <g transform="translate(20, 205)">
        <rect width="100" height="28" rx="6" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b"/>
        <text x="50" y="18" font-family="monospace" font-size="10" font-weight="700" fill="#fbbf24" text-anchor="middle">Enterprise ERP</text>
      </g>
    </g>
  </g>
</svg>
