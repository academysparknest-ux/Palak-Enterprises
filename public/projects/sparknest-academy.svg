<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="snBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#snBg)"/>

  <!-- Ambient Glow Behind Hero -->
  <circle cx="600" cy="220" r="280" fill="#6366f1" opacity="0.18" filter="url(#glow)"/>
  <circle cx="850" cy="300" r="200" fill="#ec4899" opacity="0.12" filter="url(#glow)"/>

  <!-- Header Bar -->
  <rect width="1200" height="70" fill="#0b0f19" opacity="0.9"/>
  <line x1="0" y1="70" x2="1200" y2="70" stroke="#334155" stroke-width="1"/>

  <!-- Logo -->
  <g transform="translate(60, 20)">
    <rect width="32" height="32" rx="8" fill="url(#heroGrad)"/>
    <path d="M10 22 L16 10 L22 22 Z" fill="#ffffff"/>
    <text x="44" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" fill="#ffffff" letter-spacing="-0.5">SparkNest<tspan fill="#a855f7"> Academy</tspan></text>
  </g>

  <!-- Nav Links -->
  <g transform="translate(480, 40)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
    <text x="0" y="0" fill="#ffffff" font-weight="600">Courses</text>
    <text x="90" y="0">Interactive Labs</text>
    <text x="220" y="0">Curriculum</text>
    <text x="330" y="0">Pricing</text>
  </g>

  <!-- Nav Right CTA -->
  <g transform="translate(1010, 18)">
    <rect width="130" height="34" rx="8" fill="url(#heroGrad)"/>
    <text x="65" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#ffffff" text-anchor="middle">Start Learning</text>
  </g>

  <!-- Main Hero Container -->
  <g transform="translate(60, 120)">
    <!-- Pill Tag -->
    <rect x="0" y="0" width="230" height="26" rx="13" fill="#312e81" stroke="#4f46e5" stroke-width="1"/>
    <circle cx="12" cy="13" r="4" fill="#a855f7"/>
    <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#c7d2fe">Next-Gen Education Platform</text>

    <!-- Main Headline -->
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="-1">
      Empower Your Future with
    </text>
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="url(#heroGrad)" letter-spacing="-1">
      Hands-on Interactive Coding &amp; AI
    </text>

    <!-- Subtitle -->
    <text x="0" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#94a3b8" font-weight="400">
      Master computer science, modern web engineering, and machine learning with guided project labs.
    </text>

    <!-- Hero CTA Buttons -->
    <g transform="translate(0, 205)">
      <rect width="170" height="46" rx="10" fill="url(#heroGrad)"/>
      <text x="85" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" fill="#ffffff" text-anchor="middle">Explore Catalog →</text>

      <rect x="190" y="0" width="160" height="46" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="270" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" fill="#e2e8f0" text-anchor="middle">View Syllabus</text>
    </g>
  </g>

  <!-- Interactive Code / Lab Preview Card on the Right -->
  <g transform="translate(680, 110)">
    <!-- Card Frame -->
    <rect width="460" height="260" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Editor Header -->
    <rect width="460" height="36" rx="14" fill="#1e293b"/>
    <rect y="26" width="460" height="10" fill="#1e293b"/>
    <circle cx="18" cy="18" r="4.5" fill="#ef4444"/>
    <circle cx="34" cy="18" r="4.5" fill="#f59e0b"/>
    <circle cx="50" cy="18" r="4.5" fill="#10b981"/>
    <rect x="75" y="8" width="130" height="20" rx="4" fill="#0f172a"/>
    <text x="140" y="22" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">interactive-lesson.tsx</text>

    <!-- Code Content Mockup -->
    <g transform="translate(20, 56)" font-family="Consolas, Monaco, monospace" font-size="11" fill="#94a3b8">
      <text x="0" y="15"><tspan fill="#f43f5e">export default function</tspan> <tspan fill="#38bdf8">SparkAcademy</tspan>() {</text>
      <text x="15" y="35"><tspan fill="#f43f5e">const</tspan> [progress, setProgress] = <tspan fill="#a855f7">useModule</tspan>(<tspan fill="#34d399">"FullStack"</tspan>);</text>
      <text x="15" y="55"><tspan fill="#f43f5e">return</tspan> (</text>
      <text x="30" y="75">&lt;<tspan fill="#38bdf8">InteractiveConsole</tspan> <tspan fill="#fbbf24">activeLab</tspan>=<tspan fill="#34d399">"React_v19"</tspan>&gt;</text>
      <text x="45" y="95">&lt;<tspan fill="#38bdf8">LiveCodePreview</tspan> <tspan fill="#fbbf24">status</tspan>=<tspan fill="#34d399">"Verified"</tspan> /&gt;</text>
      <text x="30" y="115">&lt;/<tspan fill="#38bdf8">InteractiveConsole</tspan>&gt;</text>
      <text x="15" y="135">);</text>
      <text x="0" y="155">}</text>
    </g>

    <!-- Live Execution Pill -->
    <rect x="320" y="210" width="120" height="30" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <circle cx="335" cy="225" r="4" fill="#10b981"/>
    <text x="348" y="229" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#34d399">All Tests Passed</text>
  </g>

  <!-- 3 Bottom Course Cards Grid -->
  <g transform="translate(60, 410)">
    <!-- Course Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="340" height="290" rx="14" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1"/>
      <rect x="20" y="20" width="40" height="40" rx="8" fill="#4f46e5" fill-opacity="0.2"/>
      <text x="40" y="45" font-size="20" text-anchor="middle">💻</text>
      <text x="75" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="15" fill="#ffffff">Full-Stack Web Dev</text>
      <text x="75" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#818cf8">Next.js 15, React, Node &amp; SQL</text>
      <text x="20" y="90" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Build complete end-to-end cloud applications with auth, state &amp; microservices.</text>
      <!-- Mini Progress -->
      <rect x="20" y="235" width="300" height="6" rx="3" fill="#1e293b"/>
      <rect x="20" y="235" width="240" height="6" rx="3" fill="url(#heroGrad)"/>
      <text x="20" y="260" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#cbd5e1">85% Complete (18/22 Labs)</text>
    </g>

    <!-- Course Card 2 -->
    <g transform="translate(370, 0)">
      <rect width="340" height="290" rx="14" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1"/>
      <rect x="20" y="20" width="40" height="40" rx="8" fill="#06b6d4" fill-opacity="0.2"/>
      <text x="40" y="45" font-size="20" text-anchor="middle">🤖</text>
      <text x="75" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="15" fill="#ffffff">Applied AI &amp; LLMs</text>
      <text x="75" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#38bdf8">Vector DBs, Python &amp; Gemini</text>
      <text x="20" y="90" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Build intelligent agents, prompt pipelines, and modern RAG search engines.</text>
      <!-- Mini Progress -->
      <rect x="20" y="235" width="300" height="6" rx="3" fill="#1e293b"/>
      <rect x="20" y="235" width="180" height="6" rx="3" fill="#06b6d4"/>
      <text x="20" y="260" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#cbd5e1">60% Complete (12/20 Labs)</text>
    </g>

    <!-- Course Card 3 -->
    <g transform="translate(740, 0)">
      <rect width="340" height="290" rx="14" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1"/>
      <rect x="20" y="20" width="40" height="40" rx="8" fill="#ec4899" fill-opacity="0.2"/>
      <text x="40" y="45" font-size="20" text-anchor="middle">🎨</text>
      <text x="75" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="15" fill="#ffffff">Design &amp; Frontend UX</text>
      <text x="75" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#f472b6">Figma, Tailwind v4 &amp; Motion</text>
      <text x="20" y="90" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Master modern design tokens, responsive layouts, and fluid micro-interactions.</text>
      <!-- Mini Progress -->
      <rect x="20" y="235" width="300" height="6" rx="3" fill="#1e293b"/>
      <rect x="20" y="235" width="290" height="6" rx="3" fill="#ec4899"/>
      <text x="20" y="260" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#cbd5e1">95% Complete (19/20 Labs)</text>
    </g>
  </g>
</svg>
